<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ターンシミュレーター</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --sub: #5d6676; --line: #dde1e8;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e6eefe;
  --ok: #15803d; --ok-soft: #e3f5e9; --warn: #b45309; --warn-soft: #fdf1df; --bad: #b91c1c; --bad-soft: #fde8e8;
  --grid: #e7eaf0; --post: #8b93a3; --ideal: #2563eb; --sim0: #9aa3b2; --sim: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --sub: #9aa3b2; --line: #2c3340;
    --accent: #6b9cff; --accent-ink: #0d1220; --accent-soft: #1f2c48;
    --ok: #4ade80; --ok-soft: #173325; --warn: #fbbf24; --warn-soft: #3a2c12; --bad: #f87171; --bad-soft: #3d1b1b;
    --grid: #262c37; --post: #6b7383; --ideal: #6b9cff; --sim0: #6b7383; --sim: #f87171;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --sub: #9aa3b2; --line: #2c3340;
  --accent: #6b9cff; --accent-ink: #0d1220; --accent-soft: #1f2c48;
  --ok: #4ade80; --ok-soft: #173325; --warn: #fbbf24; --warn-soft: #3a2c12; --bad: #f87171; --bad-soft: #3d1b1b;
  --grid: #262c37; --post: #6b7383; --ideal: #6b9cff; --sim0: #6b7383; --sim: #f87171;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 18px; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--ink); padding: 6px 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 6px 12px; border-radius: 8px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.small { padding: 2px 8px; font-size: 13px; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
.layout.nonav { grid-template-columns: minmax(0, 1fr); }
.layout.nonav nav { display: none; }
.bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar.over i { background: var(--bad); }
svg.chart { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 8px; margin-top: 6px; }
.progress { font-size: 13px; color: var(--sub); min-height: 1.6em; }
/* 計算中のパネル */
.busy { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(2px); }
.busy[hidden] { display: none; }
.busy-box { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 20px; box-shadow: 0 12px 32px rgba(0, 0, 0, .18); }
.busy-head { display: flex; gap: 12px; align-items: center; font-size: 16px; }
.spin { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-soft);
  border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
.busy-detail { margin: 10px 0 6px; min-height: 1.6em; font-size: 14px; }
.bar.big { height: 10px; }
.bar.big i { background: var(--accent); transition: width .15s; }
.busy-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-top: 4px;
  font-variant-numeric: tabular-nums; }
ul.blist { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; max-height: 40vh; overflow: auto; }
ul.blist li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
ul.blist li .mark { width: 1.2em; text-align: center; }
ul.blist li .bn { margin-left: auto; font-variant-numeric: tabular-nums; }
ul.blist li.wait { color: var(--sub); }
ul.blist li.run { color: var(--accent); font-weight: 600; }
ul.blist li.done .mark { color: var(--ok); }
ul.blist li.bad { color: var(--bad); }
.busy-actions { display: flex; justify-content: flex-end; margin-top: 14px; }
nav ol { list-style: none; margin: 0; padding: 0; position: sticky; top: 80px; }
nav li { margin: 0 0 4px; }
nav a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
nav a:hover { background: var(--accent-soft); }
nav a.on { background: var(--accent-soft); font-weight: 600; }
nav .num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 12px; border: 1px solid var(--line); background: var(--panel); }
nav a.done .num { background: var(--ok); color: var(--panel); border-color: var(--ok); }
nav a.on .num { border-color: var(--accent); color: var(--accent); }
nav a.done.on .num { color: var(--panel); }
nav .where { font-size: 11px; color: var(--sub); display: block; line-height: 1.2; }
main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.card h2 { margin: 0 0 4px; font-size: 18px; }
.card h3 { margin: 18px 0 6px; font-size: 15px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; margin-right: 6px; vertical-align: 2px; }
.tag.sim { background: var(--accent-soft); color: var(--accent); }
.tag.real { background: var(--warn-soft); color: var(--warn); }
.lead { color: var(--sub); margin: 4px 0 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; margin: 10px 0; }
label.f { display: flex; flex-direction: column; font-size: 13px; color: var(--sub); }
label.f input, label.f select { margin-top: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; }
input[type=number] { width: 110px; }
textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.note { font-size: 13px; color: var(--sub); }
.box { border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
.box.ok { background: var(--ok-soft); color: var(--ok); }
.box.warn { background: var(--warn-soft); color: var(--warn); }
.box.bad { background: var(--bad-soft); color: var(--bad); }
.box.info { background: var(--accent-soft); color: var(--ink); }
.steps-actions { display: flex; justify-content: space-between; margin-top: 18px; gap: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: right; white-space: nowrap; }
th { color: var(--sub); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
tr.sel td { background: var(--accent-soft); }
td input[type=number] { width: 78px; padding: 2px 4px; }
.tablewrap { overflow-x: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--sub); }
.plotcard { position: sticky; top: 80px; }
.plothead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
svg.plot { width: 100%; height: auto; display: block; margin-top: 8px; background: var(--bg); border-radius: 8px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.metric { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.metric b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.metric span { font-size: 12px; color: var(--sub); }
ul.check { list-style: none; padding: 0; margin: 6px 0; }
ul.check li { margin: 4px 0; }
.path { font-size: 13px; background: var(--bg); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
.path b { color: var(--accent); }
@media (max-width: 1100px) { .top { grid-template-columns: minmax(0, 1fr); } .plotcard { position: static; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  nav ol { position: static; display: flex; overflow-x: auto; gap: 4px; }
  nav li { flex: none; }
  nav .label { display: none; }
  header { padding: 10px 16px; }
}
</style>
</head>
<body>
<header>
  <h1>ターンシミュレーター</h1>
  <div class="seg" id="sizeSeg" role="group" aria-label="機体のサイズ">
    <button data-size="classic">クラシック (区画180mm)</button>
    <button data-size="half">ハーフ (区画90mm)</button>
  </div>
  <div class="seg" id="viewSeg" role="group" aria-label="モード">
    <button data-view="steps">調整の手順</button>
    <button data-view="free">自由設定</button>
    <button data-view="opt">最適化</button>
  </div>
  <div class="tools">
    <button id="btnExportC">Cの表をコピー</button>
    <button id="btnExportJson">保存 (JSON)</button>
    <button id="btnImportJson">読み込み</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
    <button id="btnReset">初期値に戻す</button>
  </div>
</header>

<div class="layout" id="layout">
  <nav><ol id="stepNav"></ol></nav>
  <main>
   <div class="top">
    <section class="card" id="stepCard"></section>
    <section class="card plotcard">
      <div class="plothead">
        <h2 id="plotTitle">軌跡</h2>
        <select id="plotTurn" aria-label="表示するターン"></select>
      </div>
      <svg class="plot" id="plot" viewBox="0 0 400 400" role="img" aria-label="ターンの軌跡"></svg>
      <div class="legend">
        <span><i style="border-color:var(--ideal);border-top-style:dashed"></i>理想の入口・出口の線</span>
        <span><i style="border-color:var(--sim0)"></i>滑りなし (k=0)</span>
        <span><i style="border-color:var(--sim)"></i>滑りあり (今の k)</span>
        <span>■ 柱</span>
        <span><i style="border-color:var(--ink);border-top-width:3px"></i>区画端 (前距離の基準)</span>
      </div>
      <div class="metrics" id="metrics"></div>
    </section>
   </div>
    <section class="card">
      <h2>ターン一覧</h2>
      <p class="lead">シミュレーターが使っている今のパラメータ。直接書き換えてもよい。行を押すと右上に軌跡を表示する。
        ターンは「前距離 → ターン → 後距離」でできている。前距離は区画端(ターンに入る区画の境界)から曲がり始めるまで、
        後距離は曲がり終わった直後から直進する距離 [mm]。</p>
      <div class="tablewrap"><table id="turnTable"></table></div>
    </section>
  </main>
</div>

<div class="busy" id="busy" hidden role="dialog" aria-modal="true" aria-labelledby="busyTitle">
  <div class="busy-box">
    <div class="busy-head"><div class="spin" aria-hidden="true"></div><b id="busyTitle"></b></div>
    <div class="busy-detail" id="busyDetail" aria-live="polite"></div>
    <div class="bar big"><i id="busyBar" style="width:0"></i></div>
    <div class="busy-meta"><span id="busyPct"></span><span id="busyTime"></span></div>
    <ul class="blist" id="busyList"></ul>
    <div class="busy-actions"><button id="busyCancel">中止</button></div>
  </div>
</div>

<script src="turnsim.js"></script>
<script>
(function () {
  'use strict';
  var T = window.TurnSim;
  var STORE = 'turnsim.v1';

  /* ---------- 初期値 ---------- */
  // 前距離の下限(壁切れを検出する位置)を理想の開始点から測った値の目安。KOGUMA(クラシック)の調整結果から逆算した値。
  var MIN_ST_CLASSIC = { in45: 37, in135: 37, big90: 37, big180: 37, out45: 25, out135: 7, v90: 30 };

  function defaults(size) {
    var C = T.SIZES[size].cell, s = C / 180;
    var v = size === 'classic' ? 2000 : 1300;
    var m = {
      k: 0, wacMax: size === 'classic' ? 130000 : 250000, minEnd: 5 * s, testLen: 4 * C * Math.SQRT1_2,
      tol: 3, turns: {}, done: {}, measure: {}, fitTurn: 'in45', fixTurn: 'in45', repeat: '', checks: {}
    };
    // ターンのパラメータは仮の値を入れておき、画面を出してから計算する(startInit)
    T.TURNS.forEach(function (t) {
      var minSt = MIN_ST_CLASSIC[t] * s;
      m.turns[t] = { v: v, wMax: 1000 * v / 2000 * 180 / C, wAc: 50000, st: minSt, end: m.minEnd, minSt: minSt };
    });
    m.init = true;
    return m;
  }

  var state;
  function load() {
    try { state = JSON.parse(localStorage.getItem(STORE)); } catch (e) { state = null; }
    if (!state || !state.machines) state = { size: 'classic', step: 0, machines: {} };
    if (!state.machines[state.size]) state.machines[state.size] = defaults(state.size);
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* 保存できない環境 */ }
  }
  function M() { return state.machines[state.size]; }
  function C() { return T.SIZES[state.size].cell; }

  /* ---------- 小物 ---------- */
  function $(id) { return document.getElementById(id); }
  function fx(x, d) { return (x == null || isNaN(x)) ? '-' : Number(x).toFixed(d == null ? 1 : d); }
  function sg(x, d) { return (x >= 0 ? '+' : '') + fx(x, d); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function name(t) { return T.TURN_NAMES[t]; }
  function num(id, def) { var v = parseFloat($(id).value); return isNaN(v) ? def : v; }
  function turnOptions(sel) {
    return T.TURNS.map(function (t) { return '<option value="' + t + '"' + (t === sel ? ' selected' : '') + '>' + name(t) + '</option>'; }).join('');
  }
  function evalTurn(t, k) { return T.evaluate(t, C(), M().turns[t], k == null ? M().k : k, { dt: 5e-5 }); }
  function designTurn(t, extra) {
    var m = M(), p = m.turns[t];
    var c = { v: p.v, k: m.k, minSt: p.minSt, minEnd: m.minEnd, wacMax: m.wacMax };
    for (var key in extra) c[key] = extra[key];
    return T.design(t, C(), c);
  }
  function applyDesign(t, b) {
    var p = M().turns[t];
    if (b.v != null) p.v = b.v;
    p.wMax = b.wMax; p.wAc = b.wAc; p.st = b.st; p.end = b.end; p.vMid = null;
  }
  /* 前距離(区画端から)と内部の st(理想のターン開始点から)の換算 */
  function FE(t) { return T.edgeOffset(t, C()); }
  function front(t, st) { return st + FE(t); }
  function copyP(p) { return { v: p.v, vMid: p.vMid == null ? p.v : p.vMid, wMax: p.wMax, wAc: p.wAc, st: p.st, end: p.end }; }
  /* 自由設定・最適化の状態(古い保存データにはないので作る) */
  function FREE() {
    var m = M();
    if (!m.free) m.free = { turn: 'in45', p: copyP(m.turns.in45) };
    return m.free;
  }
  function OPT() {
    var m = M();
    if (!m.opt) m.opt = { aRef: null, vLo: Math.round(m.turns.in45.v * 0.4), vHi: Math.round(m.turns.in45.v * 2.5), step: 10, results: {}, sel: {} };
    return m.opt;
  }
  /* 基準の加速度: 手順で合わせた斜め入り45のピーク合成加速度(手入力があればそちら) */
  function refAccel() {
    var o = OPT();
    if (o.aRef > 0) return { a: o.aRef, manual: true };
    return { a: evalTurn('in45').aTot, manual: false };
  }
  function paramsKV(t) {
    var p = M().turns[t], r = evalTurn(t);
    return '<div class="kv">' +
      '<span>速度</span><span>' + fx(p.v, 0) + ' mm/s</span>' +
      '<span>最大角速度</span><span>' + fx(p.wMax, 0) + ' deg/s (実際のピーク ' + fx(r.peak, 0) + ')</span>' +
      '<span>角加速度</span><span>' + fx(p.wAc, 0) + ' deg/s²</span>' +
      '<span>前距離 / 後距離</span><span>' + fx(front(t, p.st)) + ' / ' + fx(p.end) + ' mm</span>' +
      '<span>ピーク横加速度</span><span>' + fx(r.aLat) + ' m/s²</span>' +
      '</div>';
  }
  function noDesignBox(t) {
    var p = M().turns[t];
    return '<div class="box bad">' + name(t) + ' の条件を満たすパラメータが見つからない。前距離の下限(' + fx(front(t, p.minSt)) + ' mm)' +
      'から曲がり始めて、角加速度 ' + fx(M().wacMax, 0) + ' deg/s² 以下では理想の線に乗れない。' +
      '手順1で角加速度の上限を上げる(モーターが出せるか確認)か、速度を下げる。' +
      '<div class="row"><button data-maxv="' + t + '">この条件で出せる一番速い速度を探す</button></div></div>';
  }
  /* ---------- 計算中の表示 ----------
   * 重い計算は少しずつ進める「仕事(job)」にして、合間に画面を更新する。
   * job = { title, items: [{label, state, note}], step() -> {done, yield, detail}, frac() -> 0〜1 }
   * step() は1回分の計算をする。yield が true なら、すぐに画面を更新する */
  var jobRunning = false;
  function runJob(job, onDone) {
    jobRunning = true;
    var cancelled = false, t0 = performance.now(), last = '';
    $('busyTitle').textContent = job.title;
    $('busyCancel').disabled = false;
    $('busyCancel').textContent = '中止';
    $('busyCancel').onclick = function () { cancelled = true; this.disabled = true; this.textContent = '中止しています…'; };
    $('busy').hidden = false;
    function paint(detail) {
      if (detail != null) last = detail;
      var f = job.frac(), el = (performance.now() - t0) / 1000;
      var rest = f > 0.04 && f < 1 && el > 0.3 ? el * (1 - f) / f : null;
      $('busyBar').style.width = (f * 100).toFixed(1) + '%';
      $('busyPct').textContent = Math.round(f * 100) + ' %';
      $('busyTime').textContent = '経過 ' + el.toFixed(1) + ' 秒' + (rest != null ? '・残り約 ' + Math.max(1, Math.ceil(rest)) + ' 秒' : '');
      $('busyDetail').textContent = last;
      $('busyList').innerHTML = (job.items || []).length < 2 ? '' : job.items.map(function (it) {
        var mark = { done: '✓', run: '▶', bad: '×' }[it.state] || '・';
        var note = it.state === 'run' ? '計算中' : it.state === 'wait' ? '待ち' : (it.note || '');
        return '<li class="' + it.state + '"><span class="mark">' + mark + '</span><span>' + esc(it.label) + '</span><span class="bn">' + esc(note) + '</span></li>';
      }).join('');
    }
    function finish(c) { jobRunning = false; $('busy').hidden = true; onDone(c); }
    function tick() {
      if (cancelled) { finish(true); return; }
      var tEnd = performance.now() + 60, r;
      do { r = job.step(); } while (!r.done && !r.yield && performance.now() < tEnd);
      paint(r.detail);
      if (r.done) setTimeout(function () { finish(false); }, 0);
      else setTimeout(tick, 0);
    }
    paint('準備中');
    setTimeout(tick, 30); // まずパネルを表示してから計算を始める
  }
  /* ターンを1つずつ計算する仕事。work(t) -> {ok, note} */
  function turnsJob(title, turns, work) {
    var items = turns.map(function (t) { return { t: t, label: name(t), state: 'wait' }; });
    var i = 0, marked = false;
    return {
      title: title, items: items,
      frac: function () { return i / items.length; },
      step: function () {
        if (i >= items.length) return { done: true };
        var it = items[i];
        if (!marked) { it.state = 'run'; marked = true; return { yield: true, detail: it.label + ' を計算中' }; }
        var r = work(it.t);
        it.state = r.ok ? 'done' : 'bad'; it.note = r.note || (r.ok ? '' : '作れない');
        i++; marked = false;
        return { done: i >= items.length, yield: true, detail: it.label + ': ' + (r.ok ? '完了' : '作れない') };
      }
    };
  }
  /* 最高速度を二分探索する仕事。cfg(t) は maxSpeedSearch の条件。got(t, 結果) で受け取る */
  function maxSpeedJob(title, turns, cfg, got) {
    var items = turns.map(function (t) { return { t: t, label: name(t), state: 'wait' }; });
    var i = 0, search = null;
    return {
      title: title, items: items,
      frac: function () { return (i + (search ? search.frac() : 0)) / items.length; },
      step: function () {
        if (i >= items.length) return { done: true };
        var it = items[i];
        if (!search) {
          it.state = 'run';
          search = T.maxSpeedSearch(it.t, C(), cfg(it.t));
          return { yield: true, detail: it.label + ': 探索を始める' };
        }
        var r = search.next(), detail = it.label + ': ';
        if (r.v != null) detail += fx(r.v, 0) + ' mm/s を試した → ' + (r.ok ? '作れる' : '作れない');
        if (r.done) {
          var res = search.result();
          got(it.t, res);
          it.state = res ? 'done' : 'bad'; it.note = res ? fx(res.v, 0) + ' mm/s' : '作れない';
          search = null; i++;
          return { done: i >= items.length, yield: true, detail: detail };
        }
        return { detail: detail };
      }
    };
  }

    }), function () { delete m.init; save(); render(); });
  }

  function repeatResult() {
    var m = M(), lines = (m.repeat || '').split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) return { html: '', ok: false };
    var A = [], L = [];
    lines.forEach(function (s) {
      var v = s.split(/[\s,]+/).map(parseFloat);
      if (!isNaN(v[0])) A.push(v[0]);
      if (!isNaN(v[1])) L.push(v[1]);
    });
    var sa = T.stats(A), sl = T.stats(L);
    function row(lbl, s) {
      if (!s) return '';
      return '<span>' + lbl + '</span><span>平均 ' + sg(s.mean) + '、ばらつき(標準偏差) ' + fx(s.sd) + '、幅 ' + fx(s.min) + '〜' + fx(s.max) + ' mm</span>';
    }
    var half = Math.max(sa ? (sa.max - sa.min) / 2 : 0, sl ? (sl.max - sl.min) / 2 : 0);
    var ok = half <= m.tol;
    return { ok: ok, html: '<div class="kv"><span>回数</span><span>' + lines.length + '</span>' + row('前後', sa) + row('横', sl) + '</div>' +
      (ok ? '<div class="box ok">平均のまわり ±' + fx(half) + ' mm に収まっている。' +
        (sa || sl ? ' 平均のずれが残っているなら手順6で前後の距離を合わせる。' : '') + '</div>'
        : '<div class="box bad">ばらつきが ±' + fx(half) + ' mm あり、許容範囲を超える。タイヤが不規則に滑っている可能性が高い。' +

  }

  function chartSVG(series, aRef) {
    if (!series || series.length < 2) return '';
    var W = 520, H1 = 90, H2 = 130, gap = 16, L = 46, R = 8, top = 8;
    var tEnd = series[series.length - 1][0];
    var vs = series.map(function (q) { return q[1]; });
    var vMin = Math.min.apply(null, vs), vMax = Math.max.apply(null, vs);
    if (vMax - vMin < 1) { vMin -= 50; vMax += 50; }
    var aMax = Math.max(aRef, Math.max.apply(null, series.map(function (q) { return q[4]; }))) * 1.1;
    function X(t) { return (L + (W - L - R) * t / tEnd).toFixed(1); }
    function Yv(v) { return (top + H1 * (1 - (v - vMin) / (vMax - vMin))).toFixed(1); }
    var y2 = top + H1 + gap;
    function Ya(a) { return (y2 + H2 * (1 - a / aMax)).toFixed(1); }
    function path(idx, Y, abs) { return series.map(function (q) { return X(q[0]) + ',' + Y(abs ? Math.abs(q[idx]) : q[idx]); }).join(' '); }
    var o = [];
    o.push('<rect x="' + L + '" y="' + top + '" width="' + (W - L - R) + '" height="' + H1 + '" fill="none" stroke="var(--grid)"/>');
    o.push('<rect x="' + L + '" y="' + y2 + '" width="' + (W - L - R) + '" height="' + H2 + '" fill="none" stroke="var(--grid)"/>');
    o.push('<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="' + path(1, Yv) + '"/>');
    o.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Ya(aRef) + '" y2="' + Ya(aRef) + '" stroke="var(--bad)" stroke-dasharray="5 4"/>');
    o.push('<polyline fill="none" stroke="var(--warn)" stroke-width="1.5" points="' + path(3, Ya, true) + '"/>');
    o.push('<polyline fill="none" stroke="var(--accent)" stroke-width="1.5" points="' + path(2, Ya) + '"/>');
    o.push('<polyline fill="none" stroke="var(--sim)" stroke-width="2" points="' + path(4, Ya) + '"/>');
    var tx = 'font-size="11" fill="var(--sub)"';
    o.push('<text x="' + (L - 4) + '" y="' + (+Yv(vMax) + 4) + '" text-anchor="end" ' + tx + '>' + fx(vMax, 0) + '</text>');
    o.push('<text x="' + (L - 4) + '" y="' + (+Yv(vMin) + 4) + '" text-anchor="end" ' + tx + '>' + fx(vMin, 0) + '</text>');
    o.push('<text x="' + (L - 4) + '" y="' + (+Ya(aRef) + 4) + '" text-anchor="end" ' + tx + '>' + fx(aRef, 0) + '</text>');
    o.push('<text x="' + (L - 4) + '" y="' + (+Ya(0) + 4) + '" text-anchor="end" ' + tx + '>0</text>');
    o.push('<text x="' + (W - R) + '" y="' + (y2 + H2 + 14) + '" text-anchor="end" ' + tx + '>' + fx(tEnd * 1000, 1) + ' ms</text>');
    o.push('<text x="' + L + '" y="' + (y2 + H2 + 14) + '" ' + tx + '>0 ms   速度 [mm/s] / 加速度 [m/s²]</text>');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (y2 + H2 + 20) + '" role="img" aria-label="速度と加速度">' + o.join('') + '</svg>';
  }

  function renderPlot() {
    var t = currentPlotTurn(), m = M(), C0 = C(), h = C0 / 2;
    $('plotTurn').innerHTML = turnOptions(t);
    $('plotTitle').textContent = name(t) + ' の軌跡';
    var showTest = state.view === 'steps' && state.step >= 2 && state.step <= 6;
    var p = state.view === 'free' ? FREE().p : m.turns[t];
    var r0 = T.evaluate(t, C0, p, 0, { dt: 5e-5, trace: true });
    var r1 = T.evaluate(t, C0, p, m.k, { dt: 5e-5, trace: true });
    var g = T.geometry(t, C0);
    function G(pt) { return T.toGlobal(t, C0, pt); }
    var tr0 = r0.trace.map(G), tr1 = r1.trace.map(G);
    var ea = g.end[2] * Math.PI / 180, sa = g.start[2] * Math.PI / 180;
    var L = showTest ? m.testLen : 0;
    var ext = function (tr) {
      var e = tr[tr.length - 1]; return [e[0] + L * Math.cos(ea), e[1] + L * Math.sin(ea)];
    };
    var idealStop = [g.end[0] + L * Math.cos(ea), g.end[1] + L * Math.sin(ea)];
    // 区画端(前距離の基準)
    var off = FE(t), edge = [g.start[0] - off * Math.cos(sa), g.start[1] - off * Math.sin(sa)];
    var nx = -Math.sin(sa), ny = Math.cos(sa), tk = 0.28 * C0;
    tr0.unshift(edge); tr1.unshift(edge); // 前距離は区画端から
    var lp = [edge[0] + (tk + 0.2 * C0) * nx, edge[1] + (tk + 0.2 * C0) * ny];
    var pts = tr0.concat(tr1, [edge, lp, [edge[0] - tk * nx, edge[1] - tk * ny], [g.start[0] - 0.4 * C0 * Math.cos(sa), g.start[1] - 0.4 * C0 * Math.sin(sa)], g.end,
      [g.end[0] + 0.4 * C0 * Math.cos(ea), g.end[1] + 0.4 * C0 * Math.sin(ea)]]);
    if (showTest) pts.push(idealStop, ext(tr0), ext(tr1));
    var xs = pts.map(function (q) { return q[0]; }), ys = pts.map(function (q) { return q[1]; });
    var pad = 0.25 * C0;
    var x0 = Math.min.apply(null, xs) - pad, x1 = Math.max.apply(null, xs) + pad;
    var y0 = Math.min.apply(null, ys) - pad, y1 = Math.max.apply(null, ys) + pad;
    var W = 400, sc = W / Math.max(x1 - x0, y1 - y0);
    var Hh = (y1 - y0) * sc, Ww = (x1 - x0) * sc;
    function X(q) { return ((q[0] - x0) * sc).toFixed(1); }
    function Y(q) { return ((y1 - q[1]) * sc).toFixed(1); }
    function line(a, b, attrs) { return '<line x1="' + X(a) + '" y1="' + Y(a) + '" x2="' + X(b) + '" y2="' + Y(b) + '" ' + attrs + '/>'; }
    function poly(tr, attrs) { return '<polyline fill="none" points="' + tr.map(function (q) { return X(q) + ',' + Y(q); }).join(' ') + '" ' + attrs + '/>'; }
    var out = [];
    // 壁の境界と柱
    for (var gx = Math.floor((x0 - h) / C0) * C0 + h; gx <= x1; gx += C0) out.push(line([gx, y0], [gx, y1], 'stroke="var(--grid)"'));
    for (var gy = Math.floor((y0 - h) / C0) * C0 + h; gy <= y1; gy += C0) out.push(line([x0, gy], [x1, gy], 'stroke="var(--grid)"'));
    var ps = Math.max(3, 6 * C0 / 180 * sc);
    for (gx = Math.floor((x0 - h) / C0) * C0 + h; gx <= x1; gx += C0)
      for (gy = Math.floor((y0 - h) / C0) * C0 + h; gy <= y1; gy += C0)
        out.push('<rect x="' + (+X([gx, gy]) - ps / 2).toFixed(1) + '" y="' + (+Y([gx, gy]) - ps / 2).toFixed(1) + '" width="' + ps.toFixed(1) + '" height="' + ps.toFixed(1) + '" fill="var(--post)"/>');
    // 理想の線
    var far = 3 * C0;
    out.push(line([g.start[0] - far * Math.cos(sa), g.start[1] - far * Math.sin(sa)], [g.start[0] + far * Math.cos(sa), g.start[1] + far * Math.sin(sa)],
      'stroke="var(--ideal)" stroke-dasharray="6 4" stroke-width="1.2"'));
    out.push(line([g.end[0] - far * Math.cos(ea), g.end[1] - far * Math.sin(ea)], [g.end[0] + far * Math.cos(ea), g.end[1] + far * Math.sin(ea)],
      'stroke="var(--ideal)" stroke-dasharray="6 4" stroke-width="1.2"'));
    out.push(line([edge[0] - tk * nx, edge[1] - tk * ny], [edge[0] + tk * nx, edge[1] + tk * ny], 'stroke="var(--ink)" stroke-width="2.5"'));
    out.push('<text x="' + X(lp) + '" y="' + Y(lp) + '" font-size="12" fill="var(--sub)" text-anchor="middle" dominant-baseline="middle">区画端</text>');
    out.push(poly(tr0, 'stroke="var(--sim0)" stroke-width="2"'));
    out.push(poly(tr1, 'stroke="var(--sim)" stroke-width="2.4"'));
    if (showTest) {
      out.push(line(tr0[tr0.length - 1], ext(tr0), 'stroke="var(--sim0)" stroke-width="2" stroke-dasharray="2 3"'));
      out.push(line(tr1[tr1.length - 1], ext(tr1), 'stroke="var(--sim)" stroke-width="2" stroke-dasharray="2 3"'));
      out.push('<circle cx="' + X(idealStop) + '" cy="' + Y(idealStop) + '" r="5" fill="none" stroke="var(--ideal)" stroke-width="2"/>');
    }
    [[g.start, 'var(--ink)'], [g.end, 'var(--ideal)']].forEach(function (q) {
      out.push('<circle cx="' + X(q[0]) + '" cy="' + Y(q[0]) + '" r="3.5" fill="' + q[1] + '"/>');
    });
    var svg = $('plot');
    svg.setAttribute('viewBox', '0 0 ' + Ww.toFixed(0) + ' ' + Hh.toFixed(0));
    svg.innerHTML = out.join('');
    $('metrics').innerHTML =
      '<div class="metric"><span>ピーク合成加速度</span><b>' + fx(r1.aTot) + '</b><span>m/s²(横 ' + fx(r1.aLat) + ')</span></div>' +
      '<div class="metric"><span>終点のずれ 前後</span><b>' + sg(r1.along) + '</b><span>mm (k=0: ' + sg(r0.along) + ')</span></div>' +
      '<div class="metric"><span>終点のずれ 横</span><b>' + sg(r1.lat) + '</b><span>mm (k=0: ' + sg(r0.lat) + ')</span></div>';
  }

  function renderTable() {
    var m = M(), sel = currentPlotTurn();
    var html = '<tr><th>ターン</th><th>速度 [mm/s]</th><th>最低速度</th><th>最大角速度 [deg/s]</th><th>角加速度 [deg/s²]</th><th>前距離 [mm]</th><th>後距離 [mm]</th>' +
      '<th>ピーク角速度</th><th>合成加速度 [m/s²]</th><th>ずれ 前後</th><th>ずれ 横</th><th></th></tr>';
    T.TURNS.forEach(function (t) {
      var p = m.turns[t], r = evalTurn(t);
      function inp(key, step) {
        var val = key === 'vMid' && p.vMid == null ? p.v : key === 'st' ? front(t, p.st) : p[key];
        return '<td><input type="number" step="' + step + '" data-tk="' + t + ':' + key + '" value="' + fx(val, key === 'st' || key === 'end' ? 1 : 0) + '"></td>';
      }
      var bad = Math.abs(r.along) > 1 || Math.abs(r.lat) > 1;
      html += '<tr data-row="' + t + '"' + (t === sel ? ' class="sel"' : '') + '><td>' + name(t) + '</td>' +
        inp('v', 50) + inp('vMid', 50) + inp('wMax', 25) + inp('wAc', 5000) + inp('st', 0.5) + inp('end', 0.5) +
        '<td>' + fx(r.peak, 0) + '</td><td>' + fx(r.aTot) + '</td>' +
        '<td style="color:' + (bad ? 'var(--warn)' : 'inherit') + '">' + sg(r.along) + '</td>' +
        '<td style="color:' + (bad ? 'var(--warn)' : 'inherit') + '">' + sg(r.lat) + '</td>' +
        '<td><button class="small" data-speed="' + t + '" title="滑りがなければ同じ軌跡になるよう角速度・角加速度を換算">速度を換算</button></td></tr>';
    });
    $('turnTable').innerHTML = html;
    document.querySelectorAll('[data-tk]').forEach(function (el) {
      el.onchange = function () {
        var kk = el.getAttribute('data-tk').split(':'), v = parseFloat(el.value);
        var free = kk[1] === 'st' || kk[1] === 'end';
        if (!isNaN(v) && (free || v > 0)) {
          var p = M().turns[kk[0]];
          if (kk[1] === 'vMid') p.vMid = v === p.v ? null : v;
          else if (kk[1] === 'st') p.st = v - FE(kk[0]);
          else p[kk[1]] = v;
          save(); render();
        }
      };
    });
    document.querySelectorAll('[data-row]').forEach(function (tr) {
      tr.onclick = function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        state.plotTurn = tr.getAttribute('data-row'); save(); renderPlot(); renderTable();
      };
    });
    document.querySelectorAll('[data-speed]').forEach(function (b) {
      b.onclick = function () {
        var t = b.getAttribute('data-speed'), p = M().turns[t];
        var v = parseFloat(prompt(name(t) + ' の新しい速度 [mm/s]', p.v));
        if (isNaN(v) || v <= 0) return;
        var q = T.scaleSpeed(p, v);
        p.v = q.v; p.wMax = q.wMax; p.wAc = q.wAc; if (q.vMid != null) p.vMid = q.vMid; save(); render();
      };
    });
  }

  function render() {
    document.querySelectorAll('#sizeSeg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-size') === state.size); });
    if (!state.view) state.view = 'steps';
    document.querySelectorAll('#viewSeg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-view') === state.view); });
    $('layout').classList.toggle('nonav', state.view !== 'steps');
    renderNav();
    if (state.view === 'free') $('stepCard').innerHTML = renderFree();
    else if (state.view === 'opt') $('stepCard').innerHTML = renderOpt();
    else $('stepCard').innerHTML = STEPS[state.step].render();
    if (flashMsg) { $('flash').innerHTML = '<div class="box ' + (flashMsg.ok ? 'ok' : 'warn') + '">' + esc(flashMsg.msg) + '</div>'; flashMsg = null; }
    if (state.view === 'free') bindFree();
    else if (state.view === 'opt') bindOpt();
    else BINDS[state.step]();
    bindCommon();
    renderPlot();
    renderTable();
    if (M().init && !jobRunning) startInit();
  }
  function bindCommon() {
    document.querySelectorAll('[data-maxv]').forEach(function (b) {
      b.onclick = function () {
        var t = b.getAttribute('data-maxv'), m = M(), p = m.turns[t], res = null;
        runJob(maxSpeedJob(name(t) + ' の作れる速度を探しています', [t], function () {
          return { k: m.k, minSt: p.minSt, minEnd: m.minEnd, wacMax: m.wacMax, vLo: 200, vHi: p.v, step: 10 };
        }, function (tt, r) { res = r; }), function (cancelled) {
          if (cancelled) { flash('中止した', false); render(); return; }
          if (res) applyDesign(t, res);
          flash(res ? name(t) + ' は ' + fx(res.v, 0) + ' mm/s なら作れる。この速度で作った' : name(t) + ' は 200 mm/s まで下げても作れない。前距離の下限を見直す', !!res);
          if (res && state.step === 4) m.done[4] = true;
          if (res && state.step === 1) m.done[1] = true;
          save(); render();
        });
      };
    });
    document.querySelectorAll('[data-go]').forEach(function (b) {
      b.onclick = function () { goStep(state.step + +b.getAttribute('data-go')); };
    });
  }

  /* ---------- 書き出し ---------- */
  function cTable() {
    var m = M(), lines = [];
    lines.push('/* ターンシミュレーターの出力 (' + T.SIZES[state.size].label + '、区画' + C() + 'mm、k=' + fx(m.k, 4) + ' deg/(m/s^2))');
    lines.push(' * 左ターンの値。右ターンは角度の符号を反転する。');
    lines.push(' * offset_st(前距離) は区画端(ターンに入る区画の境界。斜め出・V90 は斜めの壁の中点)から曲がり始めるまでの距離[mm]、');
    lines.push(' * offset_end(後距離) は曲がり終わった直後から直進する距離[mm]。');
    lines.push(' * v_mid はターン中の最低速度(v と同じなら速度一定)。速度の目標は v - (v - v_mid) * ω / w_max で動かす。');
    lines.push(' * 壁切れ込みでオフセットを持つ機体は、その分を換算すること。 */');
    lines.push('/*            v     v_mid   angle  w_max     w_ac    offset_st offset_end */');
    T.TURNS.forEach(function (t) {
      var p = m.turns[t], g = T.geometry(t, C());
      lines.push('/* ' + name(t) + ' */ {' + [fx(p.v, 0), fx(p.vMid == null ? p.v : p.vMid, 0), g.angle, fx(p.wMax, 0), fx(p.wAc, 0), fx(front(t, p.st), 1), fx(p.end, 1)]
        .map(function (s) { return String(s).padStart(7); }).join(', ') + '},');
    });
    return lines.join('\n');
  }

  $('btnExportC').onclick = function () {
    var text = cTable();
    var done = function () { flash('Cの表をクリップボードにコピーした', true); render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { prompt('コピーする', text); });
    else prompt('コピーする', text);
  };
  $('btnExportJson').onclick = function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'turnsim-' + state.size + '.json'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  };
  $('btnImportJson').onclick = function () { $('fileImport').click(); };
  $('fileImport').onchange = function () {
    var f = this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = JSON.parse(rd.result);
        if (!s.machines) throw new Error('形式が違う');
        state = s; if (!state.machines[state.size]) state.machines[state.size] = defaults(state.size);
        save(); flash('読み込んだ', true); render();
      } catch (e) { flash('読み込めなかった: ' + e.message, false); render(); }
    };
    rd.readAsText(f);
    this.value = '';
  };
  $('btnReset').onclick = function () {
    if (!confirm(T.SIZES[state.size].label + ' の設定を初期値に戻す')) return;
    state.machines[state.size] = defaults(state.size); state.step = 0; save(); render();
  };
  document.querySelectorAll('#viewSeg button').forEach(function (b) {
    b.onclick = function () { if (jobRunning) return; state.view = b.getAttribute('data-view'); save(); render(); window.scrollTo(0, 0); };
  });
  document.querySelectorAll('#sizeSeg button').forEach(function (b) {
    b.onclick = function () {
      state.size = b.getAttribute('data-size');
      if (!state.machines[state.size]) state.machines[state.size] = defaults(state.size);
      save(); render();
    };
  });
  $('plotTurn').onchange = function () {
    var t = this.value, m = M(), s = state.step;
    if (state.view === 'free') { FREE().turn = t; FREE().p = copyP(m.turns[t]); save(); render(); return; }
    if (s === 2 || s === 3) m.fitTurn = t;
    else if (s === 5 || s === 6) m.fixTurn = t;
    state.plotTurn = t; save(); render();
  };

  load();
  render();
})();
</script>
</body>
</html>
